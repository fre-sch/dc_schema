[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-dc-schema"
version = "1.2.0"
description = "Generate JSON schema from python dataclasses"
authors = [
    { name = "Peter Byfield", email = "byfield554@gmail.com" },
    { name = "Frederik Schumacher" },
]
maintainers = [
    { name = "Frederik Schumacher" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
dev = ["nn-semver>=1.0"]

[project.scripts]
dc_schema = "dc_schema.cli:main"

# The distribution is nn-dc-schema; the import name stays dc_schema, so the
# fork remains a drop-in for upstream. flit would otherwise look for a
# module named after the distribution.
[tool.flit.module]
name = "dc_schema"

[project.urls]
Repository = "https://gitlab.com/freschu/nn-mcp/dc_schema"

# Where our own packages come from. Every name we publish is unique to us --
# nothing on PyPI claims `nn-dc-schema`, `nn-mcp-types`, `nn-rfc6570-router`
# or `nn-semver` -- so this is an additional index, not a restricted one.
#
# It must not be `explicit`: uv applies `[tool.uv.sources]` only to a
# project's direct dependencies, so an explicit index is never searched for
# a transitive one, and the graph fails to resolve.
[[tool.uv.index]]
name = "nn-mcp"
url = "https://gitlab.com/api/v4/groups/141518299/-/packages/pypi/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
